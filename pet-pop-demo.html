<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pet-Pop · AI宠物IP孵化器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:'Darker Grotesque',sans-serif;background:#e5e7eb;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;-webkit-font-smoothing:antialiased}
#root{width:390px;height:100vh;position:relative;background:#fff;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,0.18)}
@media(max-width:420px){#root{width:100vw;box-shadow:none}}
.no-scroll::-webkit-scrollbar{display:none}
.no-scroll{-ms-overflow-style:none;scrollbar-width:none}
@keyframes slideInR{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInL{from{transform:translateX(-50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,183,32,.4)}70%{box-shadow:0 0 0 18px rgba(245,183,32,0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.slide-r{animation:slideInR 280ms ease-out forwards}
.slide-l{animation:slideInL 280ms ease-out forwards}
.fade-in{animation:fadeIn 200ms ease-out}
.sheet-up{animation:slideUp 280ms ease-out forwards}
.toast-in{animation:toastIn 280ms ease-out forwards}
.bounce{animation:bounce 1.5s ease-in-out infinite}
.xp-bar{background:linear-gradient(90deg,#F5B720,#F09628,rgba(255,255,255,.4),#F09628,#F5B720);background-size:200% auto;animation:shimmer 2.5s linear infinite}
.pulse-ring{animation:pulse 2.5s ease-out infinite}
.spin{animation:spin 1.5s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ─── SVG PET ─── */
const PetSVG=({size=200})=>(
  <svg width={size} height={size} viewBox="0 0 220 220" fill="none">
    <ellipse cx="110" cy="170" rx="55" ry="45" fill="#F5B720"/>
    <ellipse cx="110" cy="155" rx="50" ry="40" fill="#F5B720"/>
    <ellipse cx="68" cy="188" rx="18" ry="12" fill="#E6A010" transform="rotate(-15 68 188)"/>
    <ellipse cx="152" cy="188" rx="18" ry="12" fill="#E6A010" transform="rotate(15 152 188)"/>
    <ellipse cx="110" cy="148" rx="22" ry="20" fill="#FBBF24"/>
    <circle cx="110" cy="100" r="48" fill="#C2855A"/>
    <ellipse cx="77" cy="64" rx="16" ry="20" fill="#A0612A" transform="rotate(-18 77 64)"/>
    <ellipse cx="143" cy="64" rx="16" ry="20" fill="#A0612A" transform="rotate(18 143 64)"/>
    <ellipse cx="77" cy="64" rx="9" ry="13" fill="#F9A8D4" transform="rotate(-18 77 64)"/>
    <ellipse cx="143" cy="64" rx="9" ry="13" fill="#F9A8D4" transform="rotate(18 143 64)"/>
    <circle cx="97" cy="98" r="7" fill="#1A1A1A"/>
    <circle cx="123" cy="98" r="7" fill="#1A1A1A"/>
    <circle cx="99" cy="95.5" r="2.5" fill="white"/>
    <circle cx="125" cy="95.5" r="2.5" fill="white"/>
    <ellipse cx="110" cy="113" rx="8" ry="5" fill="#E07070"/>
    <path d="M102 120 Q110 128 118 120" stroke="#C05050" strokeWidth="2" fill="none" strokeLinecap="round"/>
    <path d="M85 72 L95 54 L110 68 L125 54 L135 72" fill="#F5B720" stroke="#E09910" strokeWidth="1.5"/>
    <rect x="83" y="70" width="54" height="8" rx="4" fill="#F5B720" stroke="#E09910" strokeWidth="1"/>
    <circle cx="95" cy="54" r="4" fill="#3B82F6"/>
    <circle cx="110" cy="66" r="4" fill="#EF4444"/>
    <circle cx="125" cy="54" r="4" fill="#3B82F6"/>
  </svg>
);

/* ─── BOTTOM NAV ─── */
const NAV_TABS=[
  {id:'square',label:'Square',icon:'⊞'},
  {id:'creation',label:'Creation',icon:'✦'},
  {id:'business',label:'Business',icon:'💼'},
  {id:'home',label:'Personal',icon:'🐾'},
];
const BottomNav=({page,setPage})=>(
  <div style={{position:'absolute',bottom:0,left:0,right:0,background:'white',
    borderTop:'1px solid #f0f0f0',boxShadow:'0 -2px 16px rgba(0,0,0,.07)',
    display:'flex',height:64,zIndex:30}}>
    {NAV_TABS.map(t=>{
      const active=page===t.id;
      return(
        <button key={t.id} onClick={()=>setPage(t.id)}
          style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
            justifyContent:'center',gap:3,border:'none',background:'none',cursor:'pointer'}}>
          <span style={{fontSize:20}}>{t.icon}</span>
          <span style={{fontSize:10,fontWeight:700,color:active?'#F09628':'#9CA3AF'}}>{t.label}</span>
          {active&&<div style={{position:'absolute',bottom:0,width:24,height:2.5,
            borderRadius:2,background:'linear-gradient(90deg,#F5B720,#F09628)'}}/>}
        </button>
      );
    })}
  </div>
);

/* ─── BOTTOM SHEET ─── */
const BottomSheet=({open,onClose,title,children})=>{
  if(!open)return null;
  return(
    <>
      <div onClick={onClose} className="fade-in" style={{position:'fixed',inset:0,
        background:'rgba(0,0,0,.45)',zIndex:50}}/>
      <div className="sheet-up" style={{position:'absolute',bottom:0,left:0,right:0,
        background:'white',borderRadius:'24px 24px 0 0',zIndex:51,maxHeight:'70vh',
        display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',justifyContent:'center',padding:'12px 0 4px'}}>
          <div style={{width:40,height:4,borderRadius:2,background:'#E5E7EB'}}/>
        </div>
        {title&&<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'8px 20px 12px',borderBottom:'1px solid #f3f4f6'}}>
          <span style={{fontWeight:800,fontSize:15,color:'#1A1A1A'}}>{title}</span>
          <button onClick={onClose} style={{width:28,height:28,borderRadius:'50%',
            background:'#F3F4F6',border:'none',cursor:'pointer',fontSize:13,color:'#6B7280'}}>✕</button>
        </div>}
        <div className="no-scroll" style={{overflowY:'auto',flex:1}}>{children}</div>
      </div>
    </>
  );
};

/* ─── TOAST ─── */
const Toast=({msg,visible,onHide})=>{
  useEffect(()=>{if(visible){const t=setTimeout(onHide,2800);return()=>clearTimeout(t)}},[visible]);
  if(!visible)return null;
  return(
    <div className="toast-in" style={{position:'absolute',bottom:80,left:'50%',
      transform:'translateX(-50%)',background:'#1A1A1A',color:'white',
      padding:'12px 24px',borderRadius:9999,fontWeight:700,fontSize:13,
      whiteSpace:'nowrap',zIndex:60,boxShadow:'0 8px 24px rgba(0,0,0,.25)'}}>
      🎉 {msg}
    </div>
  );
};

/* ═══════════════════════════════════════════
   PAGE 1: ONBOARDING
═══════════════════════════════════════════ */
const PERSONALITIES=['呆萌','傲娇','活泼','贪吃'];
const TRACKS=['吃播','颜值','才艺','故事'];
const TRACK_ICONS={吃播:'🍗',颜值:'✨',才艺:'🎭',故事:'📖'};

const Onboarding=({onDone})=>{
  const [step,setStep]=useState(1);
  const [dir,setDir]=useState('r');
  const [uploaded,setUploaded]=useState(false);
  const [tags,setTags]=useState([
    {id:'a',label:'柴犬系',bg:'#FEF3C7',color:'#D97706'},
    {id:'b',label:'傲娇型',bg:'#FCE7F3',color:'#BE185D'},
    {id:'c',label:'萌系外貌',bg:'#EDE9FE',color:'#7C3AED'},
  ]);
  const [name,setName]=useState('');
  const [perso,setPerso]=useState([]);
  const [track,setTrack]=useState('');
  const [dragging,setDragging]=useState(false);

  const next=()=>{setDir('r');setStep(s=>s+1)};
  const back=()=>{setDir('l');setStep(s=>s-1)};
  const canNext=step===1?uploaded:step===2?name.trim().length>0:true;

  const Gold='linear-gradient(135deg,#F5B720,#F09628)';
  const pillBtn=(active,onClick,children,extra={})=>(
    <button onClick={onClick} style={{padding:'8px 18px',borderRadius:9999,fontWeight:700,
      fontSize:14,border:active?'none':'2px solid #E5E7EB',
      background:active?Gold:'white',color:active?'white':'#6B7280',
      boxShadow:active?'0 4px 12px rgba(245,183,32,.35)':'none',cursor:'pointer',
      transition:'all .2s',...extra}}>
      {children}
    </button>
  );

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',
      background:'linear-gradient(160deg,#FFFBF0,#FFF8E1)',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'52px 24px 12px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
          <span style={{fontSize:24}}>🐾</span>
          <span style={{fontSize:20,fontWeight:900,color:'#F09628'}}>Pet-Pop</span>
        </div>
        {/* Progress */}
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:700,color:'#6B7280'}}>
            {step===1?'上传照片':step===2?'填写信息':'确认 IP'}
          </span>
          <span style={{fontSize:13,fontWeight:700,color:'#F09628'}}>{step}/3</span>
        </div>
        <div style={{height:6,background:'#E5E7EB',borderRadius:3,overflow:'hidden'}}>
          <div style={{width:`${step/3*100}%`,height:'100%',
            background:Gold,borderRadius:3,transition:'width .5s ease'}}/>
        </div>
      </div>

      {/* Step Content */}
      <div key={step} className={dir==='r'?'slide-r':'slide-l'}
        style={{flex:1,overflowY:'auto',padding:'0 24px 24px'}} >

        {step===1&&(
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div>
              <h2 style={{fontSize:22,fontWeight:900,color:'#1A1A1A'}}>上传宠物照片</h2>
              <p style={{fontSize:13,color:'#9CA3AF',marginTop:4}}>AI 将自动识别你的宠物特征</p>
            </div>
            <div
              onDragOver={e=>{e.preventDefault();setDragging(true)}}
              onDragLeave={()=>setDragging(false)}
              onDrop={e=>{e.preventDefault();setDragging(false);setUploaded(true)}}
              onClick={()=>setUploaded(true)}
              style={{height:uploaded?220:190,borderRadius:18,
                border:dragging?'2.5px dashed #F09628':uploaded?'2.5px solid #F5B720':'2.5px dashed #D1D5DB',
                background:uploaded?'linear-gradient(160deg,#FFFBF0,#FEF3C7)':'#F9FAFB',
                display:'flex',flexDirection:'column',alignItems:'center',
                justifyContent:'center',gap:12,cursor:'pointer',transition:'all .2s'}}>
              {uploaded?(
                <>
                  <div style={{position:'relative'}}>
                    <PetSVG size={130}/>
                    <div style={{position:'absolute',bottom:0,right:0,width:28,height:28,
                      borderRadius:'50%',background:'#10B981',display:'flex',
                      alignItems:'center',justifyContent:'center',color:'white',
                      fontWeight:900,fontSize:14}}>✓</div>
                  </div>
                  <span style={{fontSize:13,fontWeight:600,color:'#6B7280'}}>照片已上传</span>
                </>
              ):(
                <>
                  <div style={{width:60,height:60,borderRadius:16,
                    background:'linear-gradient(135deg,#FEF3C7,#FDE68A)',
                    display:'flex',alignItems:'center',justifyContent:'center',fontSize:28}}>📷</div>
                  <p style={{fontSize:13,fontWeight:600,color:'#6B7280',textAlign:'center'}}>
                    拖拽照片到此处<br/><span style={{color:'#9CA3AF'}}>或点击上传</span>
                  </p>
                  <div style={{padding:'8px 20px',borderRadius:9999,background:Gold,
                    color:'white',fontWeight:700,fontSize:13}}>选择照片</div>
                </>
              )}
            </div>
            {uploaded&&(
              <div style={{background:'white',borderRadius:16,padding:16,
                boxShadow:'0 2px 12px rgba(0,0,0,.07)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <span style={{fontSize:14}}>✨</span>
                  <span style={{fontSize:13,fontWeight:700,color:'#374151'}}>AI 识别结果</span>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                  {tags.map(t=>(
                    <div key={t.id} style={{display:'flex',alignItems:'center',gap:6,
                      padding:'6px 12px',borderRadius:9999,background:t.bg,
                      color:t.color,fontWeight:700,fontSize:13}}>
                      {t.label}
                      <button onClick={e=>{e.stopPropagation();setTags(prev=>prev.filter(x=>x.id!==t.id))}}
                        style={{width:16,height:16,borderRadius:'50%',border:'none',
                          background:`${t.color}22`,color:t.color,cursor:'pointer',
                          fontWeight:900,fontSize:11,display:'flex',alignItems:'center',
                          justifyContent:'center'}}>×</button>
                    </div>
                  ))}
                  {tags.length===0&&<span style={{fontSize:12,color:'#9CA3AF',fontStyle:'italic'}}>已清除所有标签</span>}
                </div>
              </div>
            )}
          </div>
        )}

        {step===2&&(
          <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <div>
              <h2 style={{fontSize:22,fontWeight:900,color:'#1A1A1A'}}>打造你的 IP</h2>
              <p style={{fontSize:13,color:'#9CA3AF',marginTop:4}}>越详细，AI 生成效果越好</p>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:'#374151',display:'block',marginBottom:8}}>
                宠物昵称 <span style={{color:'#EF4444'}}>*</span>
              </label>
              <input value={name} onChange={e=>setName(e.target.value)} maxLength={12}
                placeholder="给宠物起个响亮的名字..."
                style={{width:'100%',padding:'14px 16px',borderRadius:14,fontSize:14,
                  fontFamily:'inherit',fontWeight:600,color:'#1A1A1A',
                  border:name.trim()?'2px solid #F5B720':'2px solid #E5E7EB',
                  background:'white',outline:'none',
                  boxShadow:name.trim()?'0 0 0 4px rgba(245,183,32,.12)':'none',
                  transition:'all .2s'}}/>
              <div style={{textAlign:'right',fontSize:11,color:'#9CA3AF',marginTop:4}}>{name.length}/12</div>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:'#374151',display:'block',marginBottom:8}}>
                性格特征 <span style={{fontWeight:400,color:'#9CA3AF'}}>（可多选）</span>
              </label>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {PERSONALITIES.map(p=>pillBtn(perso.includes(p),
                  ()=>setPerso(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]),p))}
              </div>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:'#374151',display:'block',marginBottom:8}}>
                主攻赛道 <span style={{fontWeight:400,color:'#9CA3AF'}}>（单选）</span>
              </label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                {TRACKS.map(t=>(
                  <button key={t} onClick={()=>setTrack(t)}
                    style={{display:'flex',alignItems:'center',gap:10,padding:'14px',
                      borderRadius:14,border:track===t?'2px solid #F5B720':'2px solid #E5E7EB',
                      background:track===t?'linear-gradient(135deg,#FEF3C7,#FDE68A)':'white',
                      cursor:'pointer',boxShadow:track===t?'0 4px 14px rgba(245,183,32,.3)':'none',
                      transition:'all .2s'}}>
                    <span style={{fontSize:22}}>{TRACK_ICONS[t]}</span>
                    <span style={{fontSize:14,fontWeight:700,color:track===t?'#D97706':'#374151'}}>{t}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {step===3&&(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
            <div style={{textAlign:'center'}}>
              <h2 style={{fontSize:22,fontWeight:900,color:'#1A1A1A'}}>你的 IP 诞生了！</h2>
              <p style={{fontSize:13,color:'#9CA3AF',marginTop:4}}>AI 已为你生成专属宠物 IP</p>
            </div>
            {/* IP Cover */}
            <div style={{position:'relative',width:180,height:180,borderRadius:24,
              background:'linear-gradient(145deg,#F5B720,#F09628)',
              boxShadow:'0 12px 40px rgba(245,183,32,.4)',display:'flex',
              alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
              <div style={{position:'absolute',inset:0,background:
                'radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 60%)'}}/>
              <PetSVG size={160}/>
              <div style={{position:'absolute',bottom:10,left:0,right:0,textAlign:'center'}}>
                <span style={{fontFamily:'Pacifico,cursive',fontSize:20,color:'white',
                  fontStyle:'italic',textShadow:'0 2px 8px rgba(0,0,0,.3)'}}>
                  {name||'Laoto'}
                </span>
              </div>
              <div className="bounce" style={{position:'absolute',top:-8,right:-8,fontSize:22}}>✨</div>
            </div>
            {track&&(
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 20px',
                borderRadius:9999,background:Gold,color:'white',fontWeight:700,fontSize:13,
                boxShadow:'0 4px 16px rgba(245,183,32,.4)'}}>
                <span>{TRACK_ICONS[track]}</span>
                <span>{track}赛道 推荐</span>
              </div>
            )}
            <div style={{width:'100%',background:'white',borderRadius:16,padding:16,
              boxShadow:'0 2px 12px rgba(0,0,0,.07)'}}>
              {perso.length>0&&<div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
                <span style={{fontSize:12,fontWeight:700,color:'#9CA3AF',width:40}}>性格</span>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {perso.map(p=><span key={p} style={{fontSize:11,padding:'2px 8px',borderRadius:9999,
                    background:'#FEF3C7',color:'#D97706',fontWeight:700}}>{p}</span>)}
                </div>
              </div>}
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
                <span style={{fontSize:12,fontWeight:700,color:'#9CA3AF',width:40}}>等级</span>
                <span style={{fontSize:11,padding:'2px 10px',borderRadius:9999,
                  background:'#F09628',color:'white',fontWeight:700}}>LV.1 新人</span>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <span style={{fontSize:12,fontWeight:700,color:'#9CA3AF',width:40}}>奖励</span>
                <span style={{fontSize:12,color:'#374151',fontWeight:600}}>🎁 新手礼包 100 Token 已到账</span>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Bottom buttons */}
      <div style={{padding:'8px 24px 32px',display:'flex',gap:10,flexShrink:0}}>
        {step>1&&(
          <button onClick={back} style={{width:46,height:46,borderRadius:14,border:'none',
            background:'#F3F4F6',color:'#6B7280',fontSize:18,cursor:'pointer',fontWeight:700}}>←</button>
        )}
        <button onClick={step<3?next:onDone} disabled={!canNext}
          style={{flex:1,height:46,borderRadius:9999,border:'none',
            background:canNext?Gold:'#E5E7EB',color:canNext?'white':'#9CA3AF',
            fontWeight:700,fontSize:14,cursor:canNext?'pointer':'not-allowed',
            boxShadow:canNext?'0 6px 20px rgba(245,183,32,.4)':'none',transition:'all .2s'}}>
          {step===1?'下一步：填写信息':step===2?'下一步：预览 IP':'🐾 开始养成！'}
        </button>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════
   PAGE 2: HOME
═══════════════════════════════════════════ */
const Home=({setPage})=>{
  const [sheetOpen,setSheetOpen]=useState(false);
  const MORE=[
    {icon:'🤝',label:'联名活动'},{icon:'💛',label:'粉丝团'},
    {icon:'🛍️',label:'周边商城'},{icon:'🎙️',label:'直播助手'},
    {icon:'📊',label:'数据分析'},{icon:'🏆',label:'荣誉榜'},
  ];
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',
      background:'linear-gradient(160deg,#F5B720 0%,#F09628 55%,#E8871A 100%)'}}>
      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'52px 20px 8px',flexShrink:0}}>
        <button style={{width:40,height:40,borderRadius:12,border:'none',
          background:'rgba(255,255,255,.22)',cursor:'pointer',display:'flex',
          alignItems:'center',justifyContent:'center'}}>
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
            <rect y="0" width="20" height="2.5" rx="1.25" fill="white"/>
            <rect y="5.75" width="14" height="2.5" rx="1.25" fill="white"/>
            <rect y="11.5" width="20" height="2.5" rx="1.25" fill="white"/>
          </svg>
        </button>
        {/* Followers center */}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{display:'flex'}}>
            {[['📕','#FF2442'],['🎵','#1A1A1A'],['📸','#E1306C']].map(([e,c],i)=>(

const Countdown=({deadline})=>{
  const [tl,setTl]=useState({d:0,h:0,m:0,s:0});
  useEffect(()=>{
    const calc=()=>{
      const diff=Math.max(new Date(deadline)-Date.now(),0);
      setTl({d:Math.floor(diff/86400000),h:Math.floor(diff%86400000/3600000),
        m:Math.floor(diff%3600000/60000),s:Math.floor(diff%60000/1000)});
    };
    calc();const iv=setInterval(calc,1000);return()=>clearInterval(iv);
  },[]);
  const p=n=>String(n).padStart(2,'0');
  return(
    <div style={{display:'flex',alignItems:'center',gap:3}}>
      {[[p(tl.d),'天'],[p(tl.h),'时'],[p(tl.m),'分'],[p(tl.s),'秒']].map(([v,l],i)=>(
        <React.Fragment key={i}>
          <div style={{display:'flex',alignItems:'center',gap:2}}>
            <span style={{fontWeight:900,fontSize:11,color:'white',background:'#1A1A1A',
              padding:'2px 5px',borderRadius:5,minWidth:22,textAlign:'center'}}>{v}</span>
            <span style={{fontSize:10,color:'#6B7280',fontWeight:600}}>{l}</span>
          </div>
          {i<3&&<span style={{color:'#D1D5DB',fontSize:11,fontWeight:700}}>:</span>}
        </React.Fragment>
      ))}
    </div>
  );
};
